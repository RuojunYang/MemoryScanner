name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (win-x64, framework-dependent)
        run: >
          dotnet publish src/MemoryScanner/MemoryScanner.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishReadyToRun=true
          -o dist/MemoryScanner-win-x64

      - name: Zip publish output
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MemoryScanner-win-x64/*" -DestinationPath dist/MemoryScanner-win-x64.zip

      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MemoryScanner-win-x64.zip
          generate_release_notes: true
